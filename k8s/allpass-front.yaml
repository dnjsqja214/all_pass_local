---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allpass-front
  namespace: allpass
  labels:
    app: allpass-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allpass-front
  template:
    metadata:
      labels:
        app: allpass-front
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: asus-vm200
      containers:
        - name: allpass-front
          # 태그는 GitHub Actions(build-ghcr.yml)가 커밋 SHA로 자동 갱신
          image: ghcr.io/dnjsqja214/allpass-front:f9240b4fc91cfabb5dbeda481e0ff659047787dc
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: allpass-front
  namespace: allpass
spec:
  selector:
    app: allpass-front
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: allpass
  namespace: allpass
spec:
  parentRefs:
    - name: coder-han-gateway
      namespace: gateway-system
  hostnames:
    - allpass.coder-han.com
  rules:
    - backendRefs:
        - name: allpass-front
          port: 80
